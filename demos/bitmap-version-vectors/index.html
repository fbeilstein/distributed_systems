<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Bitmap Version Vectors</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: transparent;
            font-family: monospace;
            color: #fff;
            user-select: none;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
        }

        .node-card {
            background: #1e1e1e;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 15px;
        }

        .node-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .node-header h3 {
            margin: 0;
            color: #4fc3f7;
        }

        button {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-family: monospace;
            transition: background 0.2s;
        }

        button:hover {
            background: #444;
        }

        .write-btn {
            background: #2e7d32;
            border-color: #4caf50;
        }

        .write-btn:hover {
            background: #388e3c;
        }

        .vector-row {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            height: 32px;
        }

        .vector-label {
            width: 30px;
            font-weight: bold;
            color: #aaa;
        }

        .dots-container {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .dot {
            width: 24px;
            height: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            border: 1px solid transparent;
        }

        .dot.filled {
            background: #4fc3f7;
            color: #000;
        }

        .dot.empty {
            background: transparent;
            border-color: #ef5350;
            color: #ef5350;
            border-style: dashed;
        }

        .dot.truncated {
            background: #333;
            border-color: #555;
            color: #666;
        }

        /* Specific colors for specific nodes */
        .vector-row.a .dot.filled {
            background: #4fc3f7;
        }

        .vector-row.b .dot.filled {
            background: #81c784;
        }

        .vector-row.c .dot.filled {
            background: #ffb74d;
        }

        .control-panel {
            margin-top: 25px;
            background: #1e1e1e;
            border-radius: 8px;
            padding: 15px;
            border: 2px solid #333;
        }

        .control-header {
            margin: 0 0 15px 0;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
            color: #e0e0e0;
        }

        .networks-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .transit-box {
            border: 1px solid #444;
            border-radius: 6px;
            padding: 10px;
            min-height: 100px;
            background: #252526;
        }

        .transit-title {
            margin: 0 0 10px 0;
            font-size: 0.9em;
            color: #aaa;
            text-align: center;
        }

        .msg {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #333;
            padding: 6px 10px;
            border-radius: 4px;
            margin-bottom: 8px;
            font-size: 0.9em;
            border-left: 3px solid #4fc3f7;
        }

        .msg.type-a {
            border-color: #4fc3f7;
        }

        .msg.type-b {
            border-color: #81c784;
        }

        .msg.type-c {
            border-color: #ffb74d;
        }

        .msg-actions button {
            padding: 4px 8px;
            font-size: 0.8em;
            margin-left: 4px;
        }

        .btn-deliver {
            background: #2e7d32;
        }

        .btn-drop {
            background: #c62828;
        }

        .sync-panel {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #444;
        }

        .sync-btn {
            background: #1565c0;
            border-color: #1976d2;
            font-size: 1.1em;
            padding: 10px 20px;
        }

        .sync-btn:hover {
            background: #1976d2;
        }

        .truncate-panel {
            text-align: center;
            margin-top: 20px;
        }

        .trunc-btn {
            background: #6a1b9a;
            border-color: #8e24aa;
        }

        .trunc-btn:hover {
            background: #7b1fa2;
        }
    </style>
</head>

<body>

    <div class="grid">
        <!-- Node A -->
        <div class="node-card" id="card-a">
            <div class="node-header">
                <h3>Node A</h3>
                <button class="write-btn" onclick="localWrite('a')">Write (A)</button>
            </div>
            <div class="clock" id="clock-a"></div>
        </div>

        <!-- Node B -->
        <div class="node-card" id="card-b">
            <div class="node-header">
                <h3>Node B</h3>
                <button class="write-btn" onclick="localWrite('b')">Write (B)</button>
            </div>
            <div class="clock" id="clock-b"></div>
        </div>

        <!-- Node C -->
        <div class="node-card" id="card-c">
            <div class="node-header">
                <h3>Node C</h3>
                <button class="write-btn" onclick="localWrite('c')">Write (C)</button>
            </div>
            <div class="clock" id="clock-c"></div>
        </div>
    </div>

    <div class="control-panel">
        <h4 class="control-header">Network Packets In Transit</h4>
        <div class="networks-grid">
            <div class="transit-box" id="transit-area">
                <div class="transit-title">Pending Dot Replications</div>
                <div id="messages-container"></div>
            </div>
            <div class="transit-box" id="sync-area">
                <div class="transit-title">Anti-Entropy Sessions</div>
                <div class="sync-panel" style="border: none; margin: 0; padding: 0;">
                    <button class="sync-btn" onclick="sync('a', 'b')">Sync A ↔ B</button>
                    <button class="sync-btn" onclick="sync('b', 'c')">Sync B ↔ C</button>
                    <button class="sync-btn" onclick="sync('a', 'c')">Sync A ↔ C</button>
                </div>
                <div class="truncate-panel" style="border-top: 1px solid #444; padding-top: 15px;">
                    <button class="trunc-btn" onclick="truncateGlobal()">Truncate Contiguous Logs</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // State
        const nodes = ['a', 'b', 'c'];

        // each node has a clock { a: Set, b: Set, c: Set }
        const clocks = {
            a: { a: new Set(), b: new Set(), c: new Set() },
            b: { a: new Set(), b: new Set(), c: new Set() },
            c: { a: new Set(), b: new Set(), c: new Set() }
        };

        // maximum sequence generated by each node
        const maxSeq = { a: 0, b: 0, c: 0 };

        // global truncation bounds (the minimum sequence number known by ALL nodes)
        const truncated = { a: 0, b: 0, c: 0 };

        let messageIdCounters = 0;
        const inTransit = {}; // id -> { src, dest, originNode, seq }

        // Core Functions
        function localWrite(node) {
            maxSeq[node]++;
            const seq = maxSeq[node];

            // Add to own clock
            clocks[node][node].add(seq);

            // Create broadcast messages
            nodes.forEach(target => {
                if (target !== node) {
                    const msgId = 'msg-' + messageIdCounters++;
                    inTransit[msgId] = { src: node, dest: target, originNode: node, seq: seq };
                }
            });

            render();
        }

        function deliverMessage(msgId) {
            const msg = inTransit[msgId];
            if (!msg) return;

            clocks[msg.dest][msg.originNode].add(msg.seq);
            delete inTransit[msgId];
            render();
        }

        function dropMessage(msgId) {
            delete inTransit[msgId];
            render();
        }

        function sync(n1, n2) {
            // Anti-entropy pairwise sync!
            // n1 and n2 exchange full clocks. Any dot one has that the other lacks gets copied.
            let changed = false;

            nodes.forEach(origin => {
                // n1 -> n2
                clocks[n1][origin].forEach(seq => {
                    if (!clocks[n2][origin].has(seq)) {
                        clocks[n2][origin].add(seq);
                        changed = true;
                    }
                });
                // n2 -> n1
                clocks[n2][origin].forEach(seq => {
                    if (!clocks[n1][origin].has(seq)) {
                        clocks[n1][origin].add(seq);
                        changed = true;
                    }
                });
            });

            if (changed) {
                render();
            }
        }

        function truncateGlobal() {
            // Find the maximum sequence number for each origin that is present in ALL nodes' clocks
            // Must be continuous from 1!
            nodes.forEach(origin => {
                let maxContiguousAcrossAll = maxSeq[origin]; // start with highest possible

                nodes.forEach(node => {
                    // find contiguous bound for this specific node
                    let contiguous = truncated[origin];
                    while (clocks[node][origin].has(contiguous + 1)) {
                        contiguous++;
                    }
                    if (contiguous < maxContiguousAcrossAll) {
                        maxContiguousAcrossAll = contiguous;
                    }
                });

                // Truncate up to maxContiguousAcrossAll
                if (maxContiguousAcrossAll > truncated[origin]) {
                    // remove from sets to save space
                    nodes.forEach(node => {
                        for (let i = truncated[origin] + 1; i <= maxContiguousAcrossAll; i++) {
                            clocks[node][origin].delete(i);
                        }
                    });
                    truncated[origin] = maxContiguousAcrossAll;
                }
            });

            render();
        }

        // UI Rendering
        function renderNodeClock(node) {
            const container = document.getElementById('clock-' + node);
            container.innerHTML = '';

            nodes.forEach(originRow => {
                const row = document.createElement('div');
                row.className = 'vector-row ' + originRow;

                const lbl = document.createElement('div');
                lbl.className = 'vector-label';
                lbl.textContent = originRow.toUpperCase() + ':';
                row.appendChild(lbl);

                const dotsBox = document.createElement('div');
                dotsBox.className = 'dots-container';

                // Render dots up to highest sequence known in the entire system for this origin, just to show gaps visually
                let highestGlobalForOrigin = maxSeq[originRow];

                for (let i = 1; i <= highestGlobalForOrigin; i++) {
                    const dot = document.createElement('div');

                    if (i <= truncated[originRow]) {
                        dot.className = 'dot truncated';
                        dot.textContent = 'x';
                    } else if (clocks[node][originRow].has(i)) {
                        dot.className = 'dot filled';
                        dot.textContent = i;
                    } else {
                        // GAP!
                        dot.className = 'dot empty';
                        dot.textContent = i;
                    }

                    dotsBox.appendChild(dot);
                }

                if (highestGlobalForOrigin === 0) {
                    const emptyState = document.createElement('div');
                    emptyState.style.color = '#555';
                    emptyState.style.fontSize = '12px';
                    emptyState.textContent = 'zero dots';
                    dotsBox.appendChild(emptyState);
                }

                row.appendChild(dotsBox);
                container.appendChild(row);
            });
        }

        function renderMessages() {
            const container = document.getElementById('messages-container');
            container.innerHTML = '';

            const keys = Object.keys(inTransit);
            if (keys.length === 0) {
                container.innerHTML = '<div style="color:#555; text-align:center; padding: 20px;">No messages in transit</div>';
                return;
            }

            keys.forEach(id => {
                const msg = inTransit[id];
                const el = document.createElement('div');
                el.className = 'msg type-' + msg.originNode;

                const label = document.createElement('span');
                label.innerHTML = `Dot <b>(${msg.originNode.toUpperCase()}, ${msg.seq})</b> sent to <b>${msg.dest.toUpperCase()}</b>`;

                const actions = document.createElement('div');
                actions.className = 'msg-actions';

                const deliverBtn = document.createElement('button');
                deliverBtn.className = 'btn-deliver';
                deliverBtn.textContent = 'Deliver';
                deliverBtn.onclick = () => deliverMessage(id);

                const dropBtn = document.createElement('button');
                dropBtn.className = 'btn-drop';
                dropBtn.textContent = 'Drop (Gap)';
                dropBtn.onclick = () => dropMessage(id);

                actions.appendChild(deliverBtn);
                actions.appendChild(dropBtn);

                el.appendChild(label);
                el.appendChild(actions);

                container.appendChild(el);
            });
        }

        function render() {
            nodes.forEach(renderNodeClock);
            renderMessages();
        }

        // Initial Render
        render();
    </script>
</body>

</html>
