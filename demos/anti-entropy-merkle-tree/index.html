<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Merkle Tree — Content-Addressable Proofs</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="merkle-wrap">
        <svg id="merkle-lines"></svg>

        <!-- Root -->
        <div class="label" style="top: 5%; left: 50%;">Merkle Root</div>
        <div id="m-root" class="merkle-node root" style="top: 15%; left: 50%;">ROOT</div>

        <!-- Layer 1 -->
        <div id="m-n1" class="merkle-node" style="top: 45%; left: 30%;">L1-A</div>
        <div id="m-n2" class="merkle-node" style="top: 45%; left: 70%;">L1-B</div>

        <!-- Layer 0 (Hashes) -->
        <div id="m-h1" class="merkle-node" style="top: 70%; left: 15%;">H-1</div>
        <div id="m-h2" class="merkle-node" style="top: 70%; left: 38.3%;">H-2</div>
        <div id="m-h3" class="merkle-node" style="top: 70%; left: 61.6%;">H-3</div>
        <div id="m-h4" class="merkle-node" style="top: 70%; left: 85%;">H-4</div>

        <!-- Leaves -->
        <input type="text" id="leaf-1" class="merkle-input" style="top: 90%; left: 15%;" value="Apple"
            oninput="updateTree()">
        <input type="text" id="leaf-2" class="merkle-input" style="top: 90%; left: 38.3%;" value="Banana"
            oninput="updateTree()">
        <input type="text" id="leaf-3" class="merkle-input" style="top: 90%; left: 61.6%;" value="Cherry"
            oninput="updateTree()">
        <input type="text" id="leaf-4" class="merkle-input" style="top: 90%; left: 85%;" value="Durian"
            oninput="updateTree()">
    </div>

    <script src="merkle.js"></script>
</body>

</html>
