<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Merkle Tree Demo</title>
    <style>
        :root {
            --bg-color: transparent;
            --text-color: #e0e0e0;
            --node-bg: #333;
            --node-text: #4fc3f7;
            --border-color: #555;
            --input-bg: #252526;
            --accent: #2196f3;
        }

        body.light-theme {
            --text-color: #1d1d1f;
            --node-bg: #f5f5f7;
            --node-text: #2196f3;
            --border-color: #d2d2d7;
            --input-bg: #ffffff;
            --accent: #007aff;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            color: var(--text-color);
            transition: color 0.3s;
        }

        .merkle-wrap {
            position: relative;
            height: 350px;
            width: 100%;
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.02);
            border-radius: 12px;
        }

        .merkle-node {
            padding: 12px 10px;
            background: var(--node-bg);
            color: var(--node-text);
            border-radius: 6px;
            min-width: 90px;
            text-align: center;
            font-weight: bold;
            border: 2px solid var(--border-color);
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            position: absolute;
            transform: translate(-50%, -50%);
            z-index: 1;
            font-family: monospace;
        }

        .merkle-node.changed {
            background: #ef5350 !important;
            color: #fff !important;
            border-color: #ffb74d !important;
            transform: translate(-50%, -50%) scale(1.15);
            box-shadow: 0 0 15px #ef5350 !important;
        }

        .merkle-input {
            width: 90px;
            background: var(--input-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            font-size: 1rem;
            font-family: monospace;
            outline: none;
            transition: border-color 0.2s;
            position: absolute;
            transform: translate(-50%, -50%);
        }

        .merkle-input:focus {
            border-color: var(--accent);
        }

        .label {
            position: absolute;
            transform: translate(-50%, -50%);
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.05rem;
            opacity: 0.6;
            color: var(--text-color);
        }

        svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        line {
            stroke: var(--border-color);
            stroke-width: 2;
            opacity: 0.4;
        }
    </style>
</head>

<body>
    <div class="merkle-wrap">
        <svg id="merkle-lines"></svg>

        <div class="label" style="top: 15%; left: 50%;">Merkle Root Hash</div>
        <div id="m-root" class="merkle-node"
            style="top: 25%; left: 50%; color: var(--accent); border-color: var(--accent);">00000000</div>

        <div class="label" style="top: 40%; left: 30%;">Branch Hash</div>
        <div id="m-n1" class="merkle-node" style="top: 50%; left: 30%;">00000000</div>

        <div class="label" style="top: 40%; left: 70%;">Branch Hash</div>
        <div id="m-n2" class="merkle-node" style="top: 50%; left: 70%;">00000000</div>

        <div id="m-h1" class="merkle-node" style="top: 72%; left: 15%;">00000000</div>
        <div id="m-h2" class="merkle-node" style="top: 72%; left: 38.3%;">00000000</div>
        <div id="m-h3" class="merkle-node" style="top: 72%; left: 61.6%;">00000000</div>
        <div id="m-h4" class="merkle-node" style="top: 72%; left: 85%;">00000000</div>

        <input type="text" id="m-leaf-1" class="merkle-input" style="top: 90%; left: 15%;" value="A"
            oninput="runMerkle()">
        <input type="text" id="m-leaf-2" class="merkle-input" style="top: 90%; left: 38.3%;" value="B"
            oninput="runMerkle()">
        <input type="text" id="m-leaf-3" class="merkle-input" style="top: 90%; left: 61.6%;" value="C"
            oninput="runMerkle()">
        <input type="text" id="m-leaf-4" class="merkle-input" style="top: 90%; left: 85%;" value="D"
            oninput="runMerkle()">
    </div>

    <script>
        // --- Theme Support ---
        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'theme-change') {
                if (event.data.theme === 'light') {
                    document.body.classList.add('light-theme');
                } else {
                    document.body.classList.remove('light-theme');
                }
            }
        });
        // Initial handshake
        if (window.parent !== window) {
            window.parent.postMessage({ type: 'get-theme' }, '*');
        }

        function mHash(s) {
            let hash = 0;
            for (let i = 0; i < s.length; i++) {
                hash = ((hash << 5) - hash) + s.charCodeAt(i);
                hash |= 0;
            }
            return Math.abs(hash).toString(16).padStart(8, '0').toUpperCase();
        }

        function drawLines() {
            const svg = document.getElementById('merkle-lines');
            svg.innerHTML = '';

            function connect(id1, id2) {
                const el1 = document.getElementById(id1);
                const el2 = document.getElementById(id2);
                const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute("x1", el1.style.left);
                line.setAttribute("y1", el1.style.top);
                line.setAttribute("x2", el2.style.left);
                line.setAttribute("y2", el2.style.top);
                svg.appendChild(line);
            }

            connect('m-root', 'm-n1');
            connect('m-root', 'm-n2');
            connect('m-n1', 'm-h1');
            connect('m-n1', 'm-h2');
            connect('m-n2', 'm-h3');
            connect('m-n2', 'm-h4');
            connect('m-h1', 'm-leaf-1');
            connect('m-h2', 'm-leaf-2');
            connect('m-h3', 'm-leaf-3');
            connect('m-h4', 'm-leaf-4');
        }

        function runMerkle() {
            const l1 = document.getElementById('m-leaf-1');
            const l2 = document.getElementById('m-leaf-2');
            const l3 = document.getElementById('m-leaf-3');
            const l4 = document.getElementById('m-leaf-4');

            const h1 = mHash(l1.value);
            const h2 = mHash(l2.value);
            const h3 = mHash(l3.value);
            const h4 = mHash(l4.value);

            const n1 = mHash(h1 + h2);
            const n2 = mHash(h3 + h4);
            const root = mHash(n1 + n2);

            function setNode(id, val) {
                const el = document.getElementById(id);
                if (el.textContent !== val) {
                    el.textContent = val;
                    if (el.hasAttribute('data-init')) {
                        el.classList.add('changed');
                        setTimeout(() => el.classList.remove('changed'), 400);
                    }
                    el.setAttribute('data-init', 'true');
                }
            }

            setNode('m-h1', h1); setNode('m-h2', h2); setNode('m-h3', h3); setNode('m-h4', h4);
            setNode('m-n1', n1); setNode('m-n2', n2); setNode('m-root', root);
        }

        window.onload = () => {
            drawLines();
            runMerkle();
        };
    </script>
</body>

</html>
